<form action="https://formspree.io/f/mdkdeaow" method="POST" #emailForm="ngForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">{{ 'contact.name' | translate }} *</label>
    <input
      type="text"
      id="name"
      name="name"
      [(ngModel)]="formData.name"
      required
      #nameInput="ngModel"
      class="form-control">
    <div *ngIf="nameInput.invalid && nameInput.touched" class="error-message">
      {{ 'contact.nameMandatory' | translate }}
    </div>
  </div>

  <div class="form-group">
    <label for="email">{{ 'contact.email' | translate }} *</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="formData.email"
      required
      email
      #emailInput="ngModel"
      class="form-control">
    <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
      <span *ngIf="emailInput.errors?.['required']">{{ 'contact.emailMandatory' | translate }}</span>
      <span *ngIf="emailInput.errors?.['email']">{{ 'contact.emailInvalid' | translate }}</span>
    </div>
  </div>

  <div class="form-group">
    <label for="subject">{{ 'contact.subject' | translate }} *</label>
    <input
      type="text"
      id="subject"
      name="subject"
      [(ngModel)]="formData.subject"
      required
      #subjectInput="ngModel"
      class="form-control">
    <div *ngIf="subjectInput.invalid && subjectInput.touched" class="error-message">
      {{ 'contact.subjectMandatory' | translate }}
    </div>
  </div>

  <div class="form-group">
    <label for="message">{{ 'contact.message' | translate }} *</label>
    <textarea
      id="message"
      name="message"
      [(ngModel)]="formData.message"
      required
      rows="5"
      #messageInput="ngModel"
      class="form-control"></textarea>
    <div *ngIf="messageInput.invalid && messageInput.touched" class="error-message">
      {{ 'contact.messageMandatory' | translate }}
    </div>
  </div>

  <div class="form-actions">
    <button
      type="submit"
      [disabled]="emailForm.invalid || isSubmitting"
      class="btn-submit">
      {{ isSubmitting ? ('transactional.sendingMessage' | translate) : ('transactional.messageSent' | translate) }}
    </button>
  </div>

  <div *ngIf="submitMessage" class="submit-message" [ngClass]="{'success': submitSuccess, 'error': !submitSuccess}">
    {{ submitMessage }}
  </div>
</form>
