<form action="https://formspree.io/f/mdkdeaow" method="POST" #emailForm="ngForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">Name *</label>
    <input
      type="text"
      id="name"
      name="name"
      [(ngModel)]="formData.name"
      required
      #nameInput="ngModel"
      class="form-control">
    <div *ngIf="nameInput.invalid && nameInput.touched" class="error-message">
      The name is mandatory.
    </div>
  </div>

  <div class="form-group">
    <label for="email">Email *</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="formData.email"
      required
      email
      #emailInput="ngModel"
      class="form-control">
    <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
      <span *ngIf="emailInput.errors?.['required']">The email is mandatory.</span>
      <span *ngIf="emailInput.errors?.['email']">Insert a valid email.</span>
    </div>
  </div>

  <div class="form-group">
    <label for="subject">Subject *</label>
    <input
      type="text"
      id="subject"
      name="subject"
      [(ngModel)]="formData.subject"
      required
      #subjectInput="ngModel"
      class="form-control">
    <div *ngIf="subjectInput.invalid && subjectInput.touched" class="error-message">
      The subject is mandatory.
    </div>
  </div>

  <div class="form-group">
    <label for="message">Message *</label>
    <textarea
      id="message"
      name="message"
      [(ngModel)]="formData.message"
      required
      rows="5"
      #messageInput="ngModel"
      class="form-control"></textarea>
    <div *ngIf="messageInput.invalid && messageInput.touched" class="error-message">
      The message is mandatory.
    </div>
  </div>

  <div class="form-actions">
    <button
      type="submit"
      [disabled]="emailForm.invalid || isSubmitting"
      class="btn-submit">
      {{ isSubmitting ? 'Sending the message...' : 'Message sent' }}
    </button>
  </div>

  <div *ngIf="submitMessage" class="submit-message" [ngClass]="{'success': submitSuccess, 'error': !submitSuccess}">
    {{ submitMessage }}
  </div>
</form>
